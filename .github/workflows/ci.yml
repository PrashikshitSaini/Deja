name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install Zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Build
        run: go build -trimpath ./cmd/deja
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Shell syntax
        run: sh -n scripts/install.sh && zsh -n shell/deja.zsh
      - name: Shell security test
        run: zsh -dfi -c 'source shell/deja_test.zsh'
